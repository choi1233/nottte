name: 안드로이드 APK 만들기

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: bash scripts/build-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: nottte-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      # 항상 같은 주소에서 최신 APK를 받을 수 있게 올려둬요.
      # https://github.com/<아이디>/<저장소>/releases/latest/download/nottte.apk
      - name: 최신 APK 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk nottte.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest nottte.apk --title "nottte 최신 버전" --notes "빌드 #${{ github.run_number }}" --latest
